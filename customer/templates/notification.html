<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Add a new notification in CloudKitchen system.">
    <title>Add Notification | CloudKitchen</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <nav class="navbar">
            <a href="{% url 'showindex' %}" class="logo">
                <span class="logo-icon">🍽️</span>
                <span class="logo-text">CloudKitchen</span>
            </a>
<!--            <ul class="nav-links">-->
<!--                <li><a href="{% url 'showindex' %}">Home</a></li>-->
<!--                <li><a href="{% url 'showindex' %}#features">How It Works</a></li>-->
<!--                <li><a href="{% url 'showindex' %}#menu">Menu</a></li>-->
<!--                <li><a href="{% url 'showindex' %}#testimonials">Reviews</a></li>-->
<!--            </ul>-->
            <div class="nav-auth">
                <a href="{% url 'insertuserlogin' %}" class="btn btn-outline">Login</a>
                <a href="{% url 'insertuserregistration' %}" class="btn btn-primary">Sign Up</a>
            </div>
        </nav>
    </header>

    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <span class="logo-icon">🍽️</span>
                <span class="logo-text">CloudKitchen</span>
            </div>
            {% include 'customer_menu.html' %}
        </aside>

        <main class="dashboard-content">
            <div class="page-header">
                <div class="page-breadcrumb">
                    <a href="{% url 'showindex' %}">Home</a>
                    <span class="sep">›</span>
                    <span>Add Notification</span>
                </div>
                <h1>Add <span>Notification</span></h1>
                <p>Send a notification to a user</p>
            </div>

            <div class="dashboard-card admin-form">
                <form method="post">
                    {% csrf_token %}
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="t1">User</label>
                            <input type="text" id="t1" name="t1" placeholder="Enter user" pattern="^[a-zA-Z0-9\s]+$" title="User must contain letters, numbers, and spaces only" required>
                        </div>
                        <div class="form-group">
                            <label for="t2">Title</label>
                            <input type="text" id="t2" name="t2" placeholder="Enter notification title" pattern="^[a-zA-Z0-9\s,.-]+$" title="Title must contain alphanumeric characters and common punctuation only" required>
                        </div>
                        <div class="form-group">
                            <label for="t3">Message</label>
                            <input type="text" id="t3" name="t3" placeholder="Enter message" pattern=".{3,}" title="Message must be at least 3 characters long" required>
                        </div>
                        <div class="form-group">
                            <label for="t4">Notification Date</label>
                            <input type="date" id="t4" name="t4" placeholder="YYYY-MM-DD" required>
                        </div>
                        <div class="form-group">
                            <label for="t5">Read Status</label>
                            <input type="text" id="t5" name="t5" placeholder="e.g. read, unread" pattern="^[a-zA-Z\s]+$" title="Read Status must contain letters only" required>
                        </div>
                        <div class="form-group">
                            <label for="t6">Notification Type</label>
                            <input type="text" id="t6" name="t6" placeholder="e.g. order, promo" pattern="^[a-zA-Z\s]+$" title="Notification Type must contain letters only" required>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary btn-large">🔔 Send Notification</button>
                        <a href="{% url 'shownotification' %}" class="btn btn-outline">View All Notifications</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const form = document.querySelector("form");
            if (form) {
                form.addEventListener("submit", function(event) {
                    const formTitle = document.querySelector("h1")?.textContent.trim() || document.querySelector("h2")?.textContent.trim() || "Form";
                    alert(formTitle + " form submitted successfully!");
                });
            }
        });
    </script>
</body>

</html>
