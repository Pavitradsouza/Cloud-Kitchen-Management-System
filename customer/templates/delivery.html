<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Add a new delivery record to CloudKitchen system.">
    <title>Add Delivery | CloudKitchen</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <nav class="navbar">
            <a href="{% url 'showindex' %}" class="logo">
                <span class="logo-icon">🍽️</span>
                <span class="logo-text">CloudKitchen</span>
            </a>
            
        </nav>
    </header>

    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <span class="logo-icon">🍽️</span>
                <span class="logo-text">CloudKitchen</span>
            </div>
            {% include 'owner_menu.html' %}
        </aside>

        <main class="dashboard-content">
            <div class="page-header">
                <div class="page-breadcrumb">
                    <a href="{% url 'showindex' %}">Home</a>
                    <span class="sep">›</span>
                    <span>Add Delivery</span>
                </div>
                <h1>Add <span>Delivery</span></h1>
                <p>Record a new delivery assignment</p>
            </div>

            <div class="dashboard-card admin-form">
                <form method="post">
                    {% csrf_token %}
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="t1">Order ID</label>
                            <input type="text" id="t1" name="t1" value="{{ order }}" placeholder="Enter order ID" pattern="^[a-zA-Z0-9_-]+$" title="Order ID must contain letters, numbers, hyphens, or underscores" required readonly>
                        </div>
                        <div class="form-group">
                            <label for="t2">Delivery Person</label>
                            <input type="text" id="t2" name="t2" placeholder="Enter delivery person" pattern="^[a-zA-Z\s]+$" title="Delivery Person must contain letters and spaces only" required>
                        </div>
                        <div class="form-group">
                            <label for="t3">Pickup Time</label>
                            <input type="text" id="t3" name="t3" placeholder="Enter pickup time" pattern="^[a-zA-Z0-9\s:]+$" title="Pickup Time must contain alphanumeric characters, spaces, and colons" required>
                        </div>
                        <div class="form-group">
                            <label for="t4">Delivery Time</label>
                            <input type="text" id="t4" name="t4" placeholder="Enter delivery time" pattern="^[a-zA-Z0-9\s:]+$" title="Delivery Time must contain alphanumeric characters, spaces, and colons" required>
                        </div>
                        <div class="form-group">
                            <label for="t5">Estimated Time</label>
                            <input type="text" id="t5" name="t5" placeholder="Enter estimated time" pattern="^[a-zA-Z0-9\s:]+$" title="Estimated Time must contain alphanumeric characters, spaces, and colons" required>
                        </div>
                        <div class="form-group">
                            <label for="t6">Delivery Address</label>
                            <input type="text" id="t6" name="t6" value="{{ delivery_address }}" placeholder="Enter delivery address" pattern="^[a-zA-Z0-9\s,.-]+$" title="Address must contain alphanumeric characters and common punctuation only" required>
                        </div>
                        <div class="form-group">
                            <label for="t7">Delivery Fee</label>
                            <input type="number" id="t7" name="t7" placeholder="Enter delivery fee" min="0" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="t8">Status</label>
                            <input type="text" id="t8" name="t8" value="{{ status }}" placeholder="e.g. pending, delivered" pattern="^[a-zA-Z\s]+$" title="Status must contain letters only" required>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary btn-large">🚚 Add Delivery</button>
                        
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const form = document.querySelector("form");
            if (form) {
                form.addEventListener("submit", function(event) {
                    const formTitle = document.querySelector("h1")?.textContent.trim() || document.querySelector("h2")?.textContent.trim() || "Form";
                    alert(formTitle + " form submitted successfully!");
                });
            }
        });
    </script>
</body>
</html>
