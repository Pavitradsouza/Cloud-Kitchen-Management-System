<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Add a new coupon to CloudKitchen system.">
    <title>Add Coupon | CloudKitchen</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <nav class="navbar">
            <a href="{% url 'showindex' %}" class="logo">
                <span class="logo-icon">🍽️</span>
                <span class="logo-text">CloudKitchen</span>
            </a>
            <ul class="nav-links">
                <li><a href="{% url 'showindex' %}">Home</a></li>
                <li><a href="{% url 'showindex' %}#features">How It Works</a></li>
                <li><a href="{% url 'showindex' %}#menu">Menu</a></li>
                <li><a href="{% url 'showindex' %}#testimonials">Reviews</a></li>
            </ul>
            <div class="nav-auth">
                <a href="{% url 'insertuserlogin' %}" class="btn btn-outline">Login</a>
                <a href="{% url 'insertuserregistration' %}" class="btn btn-primary">Sign Up</a>
            </div>
        </nav>
    </header>

    <div class="dashboard-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <span class="logo-icon">🍽️</span>
                <span class="logo-text">CloudKitchen</span>
            </div>
<!--            {% include 'owner_menu.html' %}-->
        </aside>

        <!-- Main Content -->
        <main class="dashboard-content">
            <div class="page-header">
                <div class="page-breadcrumb">
                    <a href="{% url 'showindex' %}">Home</a>
                    <span class="sep">›</span>
                    <span>Add Coupon</span>
                </div>
                <h1>Add <span>Coupon</span></h1>
                <p>Create a new discount coupon for your kitchen</p>
            </div>

            <div class="dashboard-card admin-form">
                <form method="post">
                    {% csrf_token %}
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="t1">Kitchen</label>
                            <input type="text" id="t1" name="t1" placeholder="Enter kitchen" pattern="^[a-zA-Z0-9\s]+$" title="Kitchen name must contain letters, numbers, and spaces only" required>
                        </div>
                        <div class="form-group">
                            <label for="t2">Coupon Code</label>
                            <input type="text" id="t2" name="t2" placeholder="Enter coupon code" pattern="^[a-zA-Z0-9_-]+$" title="Coupon Code must contain letters, numbers, hyphens, or underscores" required>
                        </div>
                        <div class="form-group">
                            <label for="t3">Description</label>
                            <input type="text" id="t3" name="t3" placeholder="Enter description" pattern=".{3,}" title="Description must be at least 3 characters long" required>
                        </div>
                        <div class="form-group">
                            <label for="t4">Discount Type</label>
                            <input type="text" id="t4" name="t4" placeholder="e.g. percentage, flat" pattern="^[a-zA-Z\s]+$" title="Discount Type must contain letters only" required>
                        </div>
                        <div class="form-group">
                            <label for="t5">Discount Value</label>
                            <input type="number" id="t5" name="t5" placeholder="Enter discount value" min="0" step="any" required>
                        </div>
                        <div class="form-group">
                            <label for="t6">Min Order Amount</label>
                            <input type="number" id="t6" name="t6" placeholder="Enter min order amount" min="0" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="t7">Max Discount Amount</label>
                            <input type="number" id="t7" name="t7" placeholder="Enter max discount" min="0" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="t8">Valid From</label>
                            <input type="date" id="t8" name="t8" placeholder="YYYY-MM-DD" required>
                        </div>
                        <div class="form-group">
                            <label for="t9">Valid To</label>
                            <input type="date" id="t9" name="t9" placeholder="YYYY-MM-DD" required>
                        </div>
                        <div class="form-group">
                            <label for="t10">Usage Limit</label>
                            <input type="number" id="t10" name="t10" placeholder="Enter usage limit" min="1" step="1" required>
                        </div>
                    </div>
                    <div class="form-grid full-width">
                        <div class="form-group">
                            <label for="t11">Status</label>
                            <input type="text" id="t11" name="t11" placeholder="e.g. active, expired" pattern="^[a-zA-Z\s]+$" title="Status must contain letters only" required>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary btn-large">🎟️ Create Coupon</button>
                        <a href="{% url 'showcoupon' %}" class="btn btn-outline">View All Coupons</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const form = document.querySelector("form");
            if (form) {
                form.addEventListener("submit", function(event) {
                    const formTitle = document.querySelector("h1")?.textContent.trim() || document.querySelector("h2")?.textContent.trim() || "Form";
                    alert(formTitle + " form submitted successfully!");
                });
            }
        });
    </script>
</body>
</html>
