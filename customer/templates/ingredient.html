<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Add a new ingredient to CloudKitchen inventory.">
    <title>Add Ingredient | CloudKitchen</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <nav class="navbar">
            <a href="{% url 'showindex' %}" class="logo">
                <span class="logo-icon">🍽️</span>
                <span class="logo-text">CloudKitchen</span>
            </a>

           
        </nav>
    </header>

    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <span class="logo-icon">🍽️</span>
                <span class="logo-text">CloudKitchen</span>
            </div>
            {% include 'owner_menu.html' %}
        </aside>

        <main class="dashboard-content">
            <div class="page-header">
                <div class="page-breadcrumb">
                    <a href="{% url 'showindex' %}">Home</a>
                    <span class="sep">›</span>
                    <span>Add Ingredient</span>
                </div>
                <h1>Add <span>Ingredient</span></h1>
                <p>Add a new ingredient to the kitchen inventory</p>
            </div>

            <div class="dashboard-card admin-form">
                <form method="post">
                    {% csrf_token %}
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="t1">Kitchen</label>
                            <select id="t1" name="t1" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; background-color: #fff; color: #333; font-size: 14px;">
                                <option value="" disabled selected style="color: #999;">Select Kitchen</option>
                                {% for k in kitchen_list %}
                                    <option value="{{ k.kitchen_name }}" style="color: #333;">{{ k.kitchen_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="t2">Ingredient Name</label>
                            <input type="text" id="t2" name="t2" placeholder="Enter ingredient name" pattern="^[a-zA-Z\s]+$" title="Ingredient name must contain letters and spaces only" required>
                        </div>
                        <div class="form-group">
                            <label for="t3">Quantity Available</label>
                            <input type="number" id="t3" name="t3" placeholder="Enter quantity" min="0" step="any" required>
                        </div>
                        <div class="form-group">
                            <label for="t4">Unit</label>
                            <input type="text" id="t4" name="t4" placeholder="e.g. kg, liters" pattern="^[a-zA-Z\s]+$" title="Unit must contain letters and spaces only" required>
                        </div>
                        <div class="form-group">
                            <label for="t5">Reorder Level</label>
                            <input type="number" id="t5" name="t5" placeholder="Enter reorder level" min="0" step="any" required>
                        </div>
                        <div class="form-group">
                            <label for="t6">Supplier Name</label>
                            <input type="text" id="t6" name="t6" placeholder="Enter supplier name" pattern="^[a-zA-Z0-9\s,.-]+$" title="Supplier Name must contain letters, numbers, spaces, and common punctuation only" required>
                        </div>
                        <div class="form-group">
                            <label for="t7">Last Restocked Date</label>
                            <input type="date" id="t7" name="t7" placeholder="YYYY-MM-DD" required>
                        </div>
                        <div class="form-group">
                            <label for="t8">Cost Per Unit</label>
                            <input type="number" id="t8" name="t8" placeholder="Enter cost per unit" min="0" step="0.01" required>
                        </div>
                    </div>
                    <div class="form-grid full-width">
                        <div class="form-group">
                            <label for="t9">Status</label>
                            <input type="text" id="t9" name="t9" placeholder="e.g. in-stock, low" pattern="^[a-zA-Z\s-]+$" title="Status must contain letters and hyphens only" required>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary btn-large">🥬 Add Ingredient</button>
                      
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const form = document.querySelector("form");
            if (form) {
                form.addEventListener("submit", function(event) {
                    const formTitle = document.querySelector("h1")?.textContent.trim() || document.querySelector("h2")?.textContent.trim() || "Form";
                    alert(formTitle + " form submitted successfully!");
                });
            }
        });
    </script>
</body>
</html>
