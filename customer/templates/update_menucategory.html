<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Update menu category in CloudKitchen system.">
    <title>Update Menu Category | CloudKitchen</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <a href="{% url 'showindex' %}" class="logo">
                <span class="logo-icon">🍽️</span>
                <span class="logo-text">CloudKitchen</span>
            </a>
        </nav>
    </header>

    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <span class="logo-icon">🍽️</span>
                <span class="logo-text">CloudKitchen</span>
            </div>
            {% include 'owner_menu.html' %}
        </aside>

        <main class="dashboard-content">
            <div class="page-header">
                <div class="page-breadcrumb">
                    <a href="{% url 'owner_home' %}">Home</a>
                    <span class="sep">›</span>
                    <a href="{% url 'owner_showmenucategory' %}">Update Menu Categories</a>
                    <span class="sep">›</span>
                    <span>Edit</span>
                </div>
                <h1>Update <span>Menu Category</span></h1>
                <p>Edit the details of the selected menu category</p>
            </div>

            <div class="dashboard-card admin-form">
                <form method="post">
                    {% csrf_token %}
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="t1">Kitchen Name</label>
                            <input type="text" id="t1" name="t1" value="{{ category.kitchen }}" placeholder="Enter kitchen name" pattern="^[a-zA-Z0-9\s]+$" title="Kitchen name must contain letters, numbers, and spaces only" required>
                        </div>
                        <div class="form-group">
                            <label for="t2">Category Name</label>
                            <input type="text" id="t2" name="t2" value="{{ category.category_name }}" placeholder="Enter category name" pattern="^[a-zA-Z0-9\s]+$" title="Category Name must contain letters, numbers, and spaces only" required>
                        </div>
                        <div class="form-group">
                            <label for="t3">Description</label>
                            <input type="text" id="t3" name="t3" value="{{ category.description }}" placeholder="Enter description" pattern=".{3,}" title="Description must be at least 3 characters long" required>
                        </div>
                        <div class="form-group">
                            <label for="t4">Display Order</label>
                            <input type="number" id="t4" name="t4" value="{{ category.display_order }}" placeholder="Enter display order" min="1" step="1" required>
                        </div>
                    </div>
                    <div class="form-grid full-width">
                        <div class="form-group">
                            <label for="t5">Status</label>
                            <input type="text" id="t5" name="t5" value="{{ category.status }}" placeholder="e.g. active, inactive" pattern="^[a-zA-Z\s]+$" title="Status must contain letters and spaces only" required>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary btn-large">📂 Update Category</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const form = document.querySelector("form");
            if (form) {
                form.addEventListener("submit", function(event) {
                    const formTitle = document.querySelector("h1")?.textContent.trim() || "Form";
                    alert(formTitle + " form submitted successfully!");
                });
            }
        });
    </script>
</body>
</html>
